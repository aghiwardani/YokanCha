# CI: run the test suite on every push and pull request.
# CD: on a push to main (after the tests pass), build the app and ship it to
# the VPS over SSH, then run deploy/after-deploy.sh there.
#
# Repository secrets (Settings > Secrets and variables > Actions):
#   SSH_HOST         VPS address, e.g. 103.55.38.39
#   SSH_USER         deploy
#   SSH_PRIVATE_KEY  private half of the deploy key (no passphrase)
#   SSH_KNOWN_HOSTS  output of: ssh-keyscan -t ed25519 <SSH_HOST>
name: CI/CD

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

env:
  PHP_VERSION: '8.4'
  NODE_VERSION: '20'
  APP_DIR: /var/www/yokancha

jobs:
  test:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, pdo_sqlite, bcmath, intl, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Composer install
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Build assets (views reference the Vite manifest)
        run: |
          npm ci
          npm run build

      - name: Prepare .env
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Run tests
        run: php artisan test

  deploy:
    name: Deploy to VPS
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          extensions: mbstring, bcmath, intl, gd, zip
          coverage: none

      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Production dependencies and assets
        run: |
          composer install --no-dev --no-interaction --prefer-dist --no-progress --optimize-autoloader
          npm ci
          npm run build

      - name: SSH key
        run: |
          install -d -m 700 ~/.ssh
          printf '%s\n' "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "${{ secrets.SSH_KNOWN_HOSTS }}" > ~/.ssh/known_hosts

      - name: Upload release
        # .env, storage/ and compiled caches live only on the server and are
        # never overwritten or deleted.
        run: |
          rsync -az --delete \
            -e "ssh -i ~/.ssh/deploy_key" \
            --exclude='/.git/' --exclude='/.github/' --exclude='/node_modules/' \
            --exclude='/tests/' --exclude='/.env' --exclude='/.env.*' \
            --exclude='/storage/' --exclude='/bootstrap/cache/*.php' \
            --exclude='/public/hot' --exclude='/.superpowers/' \
            ./ "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:${{ env.APP_DIR }}/"

      - name: Migrate and warm caches
        run: |
          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" \
            "bash ${{ env.APP_DIR }}/deploy/after-deploy.sh"
